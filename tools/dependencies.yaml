# Runtime dependency manifest used by link_dependencies.py and package_runtime_dlls.py.
# root may be a path or a variable read from CMakeCache.txt / the listed CMake file.
dependencies:
  - name: onnxruntime
    requires: [INFERRT_BUILD_ONNX]
    cmake: cmake/ConfigONNXRuntime.cmake
    root: ONNXRUNTIME_ROOT
    destinations:
      - build/bin
    windows:
      - lib/*.dll
    linux:
      - lib/libonnxruntime.so*
    macos:
      - lib/libonnxruntime*.dylib

  - name: tensorrt
    requires: [INFERRT_ENABLE_CUDA, INFERRT_BUILD_TENSORRT]
    cmake: cmake/ConfigTensorRT.cmake
    root: TRT_ROOT
    destinations:
      - build/bin
    windows:
      - bin/*.dll
    linux:
      - lib/libnvinfer.so*
      - lib/libnvinfer_plugin.so*
      - lib/libnvonnxparser.so*
    macos:
      - lib/libnvinfer*.dylib
      - lib/libnvonnxparser*.dylib

  - name: opencv
    requires: [INFERRT_ENABLE_CUDA]
    cmake: cmake/ConfigOpenCV.cmake
    root: OpenCV_HOME
    windows_root: OpenCV_BIN_DIR
    destinations:
      - build/bin
    windows:
      - "*.dll"
    linux:
      - lib/libopencv*.so*
    macos:
      - lib/libopencv*.dylib

  - name: faiss
    requires: [INFERRT_ENABLE_CUDA, INFERRT_BUILD_TENSORRT]
    cmake: cmake/ConfigFaiss.cmake
    root: Faiss_HOME
    destinations:
      - build/bin
    windows:
      - bin/*.dll
    linux:
      - lib/libfaiss*.so*
    macos:
      - lib/libfaiss*.dylib

  # FAISS on Windows links the Intel MKL threaded runtime dynamically.
  # Keep these files in the package so feature binaries do not depend on a
  # developer machine's MKL installation.
  - name: faiss-mkl-runtime
    requires: [INFERRT_ENABLE_CUDA, INFERRT_BUILD_TENSORRT]
    cmake: cmake/ConfigFaiss.cmake
    root: MKL_ROOT
    destinations:
      - build/bin
    windows:
      - bin/mkl_avx2.2.dll
      - bin/mkl_def.2.dll
      - bin/mkl_intel_thread.2.dll
      - bin/mkl_core.2.dll

  - name: faiss-mkl-openmp-runtime
    requires: [INFERRT_ENABLE_CUDA, INFERRT_BUILD_TENSORRT]
    cmake: cmake/ConfigFaiss.cmake
    root: MKL_ROOT
    destinations:
      - build/bin
    windows:
      - ../compiler/bin/libiomp5md.dll

  - name: openvino-runtime
    requires: [INFERRT_BUILD_OPENVINO]
    cmake: cmake/ConfigOpenVINO.cmake
    root: INFERRT_OPENVINO_ROOT
    destinations:
      - build/bin
    windows:
      - runtime/bin/intel64/{build_config}/*.dll
      - runtime/bin/intel64/{build_config}/cache.json
    linux:
      - runtime/lib/intel64/*.so*
    macos:
      - runtime/lib/intel64/*.dylib

  - name: openvino-tbb
    requires: [INFERRT_BUILD_OPENVINO]
    cmake: cmake/ConfigOpenVINO.cmake
    root: INFERRT_OPENVINO_ROOT
    destinations:
      - build/bin
    windows:
      - runtime/3rdparty/tbb/bin/tbb12.dll
      - runtime/3rdparty/tbb/bin/tbbbind_2_5.dll
      - runtime/3rdparty/tbb/bin/tbbmalloc.dll
      - runtime/3rdparty/tbb/bin/tbbmalloc_proxy.dll

  - name: cuda
    requires: [INFERRT_ENABLE_CUDA]
    cmake: cmake/ConfigCUDA.cmake
    env: CUDA_PATH
    root: INFERRT_CUDA_ROOT
    destinations:
      - build/bin
    windows:
      - bin/cudart64_*.dll
      - bin/cublas64_*.dll
      - bin/cublasLt64_*.dll
      - bin/cufft64_*.dll
      - bin/cudnn*.dll
    linux:
      - lib64/libcudart.so*
      - lib64/libcublas.so*
      - lib64/libcublasLt.so*
      - lib64/libcufft.so*
      - lib64/libcudnn.so*
    macos:
      - lib/libcudart*.dylib
      - lib/libcublas*.dylib
      - lib/libcufft*.dylib

  - name: python-torch-zlib
    requires: [INFERRT_ENABLE_CUDA, INFERRT_BUILD_TENSORRT, INFERRT_BUILD_PYTHON]
    cmake: cmake/ConfigPython.cmake
    root: INFERRT_PYTHON_ROOT
    default: D:/Software/anaconda3/envs/py312
    destinations:
      - build/bin
    windows:
      - Lib/site-packages/torch/lib/zlibwapi.dll
