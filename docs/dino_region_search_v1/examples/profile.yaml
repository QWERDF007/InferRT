# CLI 可直接读取的 DINOv3-S/16 开发 profile；将权重路径替换为本机文件。
profile_id: dinov3_vits16_development
mode: appearance
model:
  name: dinov3_vits16
  weights_path: /absolute/path/to/dinov3_vits16.wts
  encoder_edge: 512
  precision: fp32
  batch_size: 4
  runtime: tensorrt:0
input:
  min_image_edge: 256
  max_image_edge: 4096
  min_target_short_px: 64
  max_target_aspect: 4.0
views:
  source_tile_edges: [512, 1024, 2048]
  overlap: 0.25
query:
  roi_long_edges: [128, 256, 448]
  grid_bins: 4
  max_tokens_per_bin: 2
  min_local_evidence: 4
regions:
  window_ratios: [1.0, 0.5, 0.25]
  stride_ratio: 0.5
  min_valid_fraction: 0.5
merge:
  enabled: true
  epsilon: 0.1
  max_leaf_side_patches: 4
quantization:
  format: int8
search:
  block_descriptors: 32768
  region_pool: 400
  local_view_pool: 200
  local_region_pool: 400
  coarse_k: 100
  coarse_dedup_iou: 0.85
  coarse_dedup_area_ratio: 1.25
fine:
  candidate_expand: 1.2
  min_template_short_patches: 2
  scale_step: 1.4142135623730951
  max_scales: 12
  peaks_per_candidate: 3
  refinement_rounds: 1
  match_cosine_threshold: 0.55
  normalized_position_tolerance: 0.25
  score_weights: [0.6, 0.25, 0.15]
  nms_iou: 0.5
  final_k: 20
decision:
  threshold: null
deadline_ms: 30000
