[pytest]
# InferRT Python 集成测试配置
testpaths = .
python_files = test_*.py

# 默认选项
#   -ra：失败时展示额外摘要
# 可选：在 addopts 中覆盖张量容差（见 conftest.py 中 pytest_addoption）
#   --inferrt-rtol  相对容差，默认 1e-6
#   --inferrt-atol  绝对容差，默认 5e-2
#   --inferrt-build-dir  CMake 构建目录；默认 INFERRT_BUILD_DIR 或 <repo>/build
addopts = -ra --inferrt-rtol=1e-4 --inferrt-atol=1.5e-1

markers =
    # integration：需要 inferrt_model_py、.wts；分类还需 torch/torchvision；特征需 sample；infer_v2 需 CUDA
    integration: requires built inferrt_model_py, sample executables, CUDA, and .wts weights
