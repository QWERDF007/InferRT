[pytest]
# InferRT Python 集成测试配置
testpaths = .
python_files = test_*.py

# 默认选项
#   -ra：失败时展示额外摘要
# 可选：在 addopts 中覆盖张量容差（见 conftest.py 中 pytest_addoption）
#   --inferrt-rtol  相对容差，默认 1e-4
#   --inferrt-atol  绝对容差，默认 5e-3
#   --inferrt-build-dir  CMake 构建目录；默认使用环境变量 INFERRT_BUILD_DIR 或 <repo>/build
# 示例：
# addopts = -ra --inferrt-rtol=1e-5 --inferrt-atol=1e-5
addopts = -ra

markers =
    # integration：需要 inferrt_model_py、sample 可执行文件、CUDA（infer_v2）与 .wts 权重
    integration: requires built inferrt_model_py, sample executables, CUDA, and .wts weights
