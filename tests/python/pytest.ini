[pytest]
# InferRT Python 集成测试配置
testpaths = .
python_files = test_*.py

# 默认选项
#   -ra：失败时展示额外摘要
# 可选：在 addopts 中覆盖张量容差（见 conftest.py 中 pytest_addoption）
#   --inferrt-rtol           分类/infer_v2 相对容差，默认 1e-6
#   --inferrt-atol           分类/infer_v2 绝对容差，默认 5e-2
#   --inferrt-feature-rtol   特征提取相对容差，默认 1e-4
#   --inferrt-feature-atol   特征提取绝对容差，默认 1.5e-1
#   --inferrt-build-dir      
#       CMake 构建目录；默认 INFERRT_BUILD_DIR 或 <repo>/build
#   --inferrt-model-root
#       真实模型根目录；默认 INFERRT_MODEL_ROOT 或 assets/models
#   --inferrt-lingbot-vision-root
#       LingBot-Vision checkpoint 目录；默认 INFERRT_LINGBOT_VISION_ROOT 或 F:/models/lingbot-vision
#   --inferrt-lingbot-vision-repo
#       LingBot-Vision 源码目录；默认 INFERRT_LINGBOT_VISION_REPO 或 F:/Github/lingbot-vision
#   --inferrt-ultralytics-repo
#       本地 ultralytics 仓库；默认 D:/Github/ultralytics
#   --inferrt-yolov5-repo
#       本地 YOLOv5 仓库；默认 INFERRT_YOLOV5_REPO 或 F:/Github/CV/yolov5
#   --inferrt-sam-root
#       本地 segment-anything 仓库；默认 D:/Github/SAM/segment-anything
#   --inferrt-sam2-root
#       本地 SAM2 仓库；默认 D:/Github/SAM/sam2
#   --inferrt-edge-sam-root
#       本地 EdgeSAM 仓库；默认 F:/Github/SAM-based/EdgeSAM
#   --inferrt-edge-sam-checkpoint
#       EdgeSAM checkpoint；默认 <model-root>/SAM/edge_sam.pth
#   --inferrt-compare-runtime
#       要对比的运行时，逗号分隔：TensorRT、onnx、openvino（大小写不敏感）
#   --inferrt-model-root
#       直接扫描 --inferrt-model-root/{resnet,dinov2,dinov3} 下的 checkpoint，并在对应模型子目录导出 .wts/.onnx
#   --inferrt-dinov2-hub-repo
#       可选的本地 facebookresearch/dinov2 torch.hub 仓库，用于离线加载 DINOv2 checkpoint
#   --inferrt-compare-devices
#       选择后端设备：cpu、gpu，或 cpu,gpu
addopts = -ra --inferrt-rtol=1e-6 --inferrt-atol=5e-2 --inferrt-feature-rtol=1e-4 --inferrt-feature-atol=1.5e-1

markers =
    # integration：需要 inferrt_model_py、.wts；分类还需 torch/torchvision；特征需 sample；infer_v2 需 CUDA
    integration: requires built inferrt_model_py, sample executables, CUDA, and .wts weights
    # slow：会导出真实模型权重或构建 TensorRT engine，通常只在本地完整验证时运行
    slow: exports real model weights or builds TensorRT engines
